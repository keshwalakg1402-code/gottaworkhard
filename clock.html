<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080808;
            color: #cfcfcf;
            font-family: monospace;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            text-align: center;
        }

        .message {
            font-size: 17px;
            line-height: 1.8;
            letter-spacing: 1px;
            margin-bottom: 55px;
        }

        .clock {
            font-size: 34px;
            letter-spacing: 5px;
            line-height: 1.7;
        }

        .pair {
            margin: 35px 0;
        }

        .time {
            margin: 5px 0;
        }

        .number {
            font-size: 10px;
            color: #444;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .footer {
            margin-top: 65px;
            font-size: 10px;
            color: #333;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="message">
        You guys are smart. I see.<br>
        You may move forward.
    </div>

    <div class="clock">

        <div class="pair">
            <div class="number">01</div>
            <div class="time">10:31</div>
            <div class="time">10:31</div>
        </div>

        <div class="pair">
            <div class="number">02</div>
            <div class="time">10:42</div>
            <div class="time">10:43</div>
        </div>

        <div class="pair">
            <div class="number">03</div>
            <div class="time">10:51</div>
            <div class="time">10:51</div>
        </div>

        <div class="pair">
            <div class="number">04</div>
            <div class="time">11:03</div>
            <div class="time">11:04</div>
        </div>

    </div>

    <div class="footer">
        ...
    </div>

</div>

</body>
</html>
