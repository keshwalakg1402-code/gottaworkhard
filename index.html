<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080808;
            color: #c8c8c8;
            font-family: monospace;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        .title {
            font-size: 12px;
            color: #444;
            letter-spacing: 6px;
            margin-bottom: 50px;
        }

        .alphabet {
            font-size: 18px;
            letter-spacing: 6px;
            line-height: 2;
            margin-bottom: 60px;
        }

        .arrow {
            color: #555;
            margin: 10px;
        }

        .encoded {
            font-size: 16px;
            line-height: 2.2;
            letter-spacing: 3px;
            word-break: break-all;
        }

        .hint {
            margin-top: 70px;
            font-size: 9px;
            color: #333;
            letter-spacing: 3px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="title">
        SIGNAL 01
    </div>

    <div class="alphabet">
        ABCDEFGHIJKLMNOPQRSTUVWXYZ
        <div class="arrow">↓</div>
        QWERTYUIOPASDFGHJKLZXCVBNM
    </div>

    <div class="encoded">

        <div>
            IZZHL://ATLIVQSQAU1402-EGRT.UOZIXW.OG/UGZZQVGKAIQKR/ESGEA.IZDS
        </div>

    </div>

    <div class="hint">
        NOTHING HERE IS RANDOM
    </div>

</div>

</body>
</html>
