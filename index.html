<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>...</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #090909;
            color: #cfcfcf;
            font-family: monospace;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 750px;
            text-align: center;
        }

        .title {
            font-size: 13px;
            letter-spacing: 5px;
            color: #555;
            margin-bottom: 45px;
        }

        .alphabet {
            font-size: 18px;
            letter-spacing: 7px;
            line-height: 2.2;
            word-break: break-all;
            margin-bottom: 60px;
        }

        .message {
            font-size: 20px;
            line-height: 2;
            letter-spacing: 3px;
            word-break: break-all;
        }

        .line {
            margin: 14px 0;
        }

        .footer {
            margin-top: 70px;
            font-size: 10px;
            color: #333;
            letter-spacing: 2px;
        }

        /* subtle distortion */
        .glitch {
            animation: flicker 4s infinite;
        }

        @keyframes flicker {
            0%, 95%, 100% {
                opacity: 1;
            }

            96% {
                opacity: 0.4;
            }

            97% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="title glitch">
        SIGNAL_01
    </div>

    <!-- NORMAL ALPHABET -->
    <div class="alphabet">
        ABCDEFGHIJKLMNOPQRSTUVWXYZ
        <br>
        ↓
        <br>
        QWERTYUIOPASDFGHJKLZXCVBNM
    </div>

    <!-- ENCODED MESSAGE -->
    <div class="message">

        <div class="line">
            ZIT UXNL LRTKFZ. O LTT.
        </div>

        <div class="line">
            NGX DQN FGV TGNX.
        </div>

    </div>

    <div class="footer">
        SOMEWHERE BETWEEN THE LETTERS
    </div>

</div>

</body>
</html>
